<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>8-Step Sampler</title>

  <!-- 動画から音声を抽出するためのffmpeg.wasm -->
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>

  <style>
    :root {
      --bg: #111318;
      --panel: #1b1f27;
      --panel2: #252b36;
      --text: #f4f4f5;
      --muted: #9ca3af;
      --active: #f59e0b;
      --play: #22c55e;
      --stop: #ef4444;
      --playhead: #38bdf8;
      --border: #3b4351;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--bg);
      touch-action: manipulation;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(14px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(22px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #0b0d11, var(--bg));
    }

    button, input { font: inherit; }

    button {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .app {
      width: min(100%, 900px);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 5px;
      font-size: clamp(26px, 7vw, 42px);
    }

    .subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .transport {
      position: sticky;
      top: max(8px, env(safe-area-inset-top));
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      padding: 10px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: rgba(27, 31, 39, .96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .transport button {
      min-height: 48px;
      border: 0;
      border-radius: 11px;
      font-weight: 800;
    }

    #playButton { background: var(--play); color: #061008; }
    #stopButton { background: var(--stop); color: white; }
    #clearButton {
      background: var(--panel2);
      color: white;
      border: 1px solid var(--border);
    }

    button:disabled,
    .file-button.disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .bpm-row {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px 0;
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
    }

    #bpmInput {
      width: 100px;
      min-height: 42px;
      padding: 8px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #0e1117;
      color: white;
      text-align: center;
    }

    .track {
      margin-bottom: 13px;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }

    .track-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 9px;
    }

    .track-title {
      font-weight: 800;
      font-size: 17px;
    }

    .file-name {
      max-width: 55vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 10px;
    }

    .file-label input { display: none; }

    .file-button {
      min-height: 44px;
      display: grid;
      place-items: center;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel2);
      font-weight: 700;
      font-size: 14px;
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      min-height: 38px;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .step {
      min-height: 58px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--muted);
      font-weight: 900;
      font-size: 16px;
    }

    .step.active {
      background: var(--active);
      border-color: #fbbf24;
      color: #211400;
    }

    .step.playhead {
      outline: 3px solid var(--playhead);
      outline-offset: 2px;
    }

    .status {
      min-height: 1.7em;
      margin: 8px 2px 0;
      color: var(--playhead);
      font-size: 13px;
      line-height: 1.45;
    }

    .progress-wrap {
      height: 6px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--panel2);
      visibility: hidden;
    }

    .progress-wrap.visible { visibility: visible; }

    .progress {
      width: 0%;
      height: 100%;
      background: var(--playhead);
      transition: width .15s linear;
    }

    .note {
      margin: 11px 2px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    @media (min-width: 700px) {
      .steps { grid-template-columns: repeat(8, 1fr); }
      .step { min-height: 64px; }
      .file-name { max-width: 420px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>8-Step Sampler</h1>
    <p class="subtitle">
      音声や動画から音を読み込み、4トラックを同時に鳴らせるステップシーケンサー
    </p>

    <section class="transport">
      <button id="playButton" type="button">▶ PLAY</button>
      <button id="stopButton" type="button">■ STOP</button>
      <button id="clearButton" type="button">CLEAR</button>

      <label class="bpm-row">
        <span>BPM</span>
        <input id="bpmInput" type="number" inputmode="numeric"
               min="30" max="300" value="60" />
      </label>
    </section>

    <section id="tracks"></section>

    <p id="status" class="status" aria-live="polite">
      音声または動画を選んでください。
    </p>
    <div id="progressWrap" class="progress-wrap">
      <div id="progress" class="progress"></div>
    </div>

    <p class="note">
      動画を選ぶと、ブラウザ内で音声だけをWAVへ変換します。ファイルは外部へ送信されません。
      初回の動画変換時は変換エンジンの読み込みに時間がかかります。長い動画や大きな動画は、
      iPhoneのメモリ不足で変換できない場合があります。
    </p>
  </main>

  <script>
    "use strict";

    const TRACK_COUNT = 4;
    const STEP_COUNT = 8;
    const MAX_FILE_SIZE = 150 * 1024 * 1024;

    const state = {
      bpm: 60,
      playing: false,
      converting: false,
      currentStep: 0,
      nextTime: 0,
      timerId: null,
      generation: 0,
      lookaheadMs: 25,
      scheduleAhead: 0.1,
      tracks: Array.from({ length: TRACK_COUNT }, (_, index) => ({
        name: `Track ${index + 1}`,
        fileName: "未選択",
        buffer: null,
        volume: 0.8,
        gainNode: null,
        steps: Array(STEP_COUNT).fill(false)
      }))
    };

    let audioContext = null;
    let ffmpeg = null;
    let ffmpegLoaded = false;

    const tracksElement = document.getElementById("tracks");
    const playButton = document.getElementById("playButton");
    const stopButton = document.getElementById("stopButton");
    const clearButton = document.getElementById("clearButton");
    const bpmInput = document.getElementById("bpmInput");
    const status = document.getElementById("status");
    const progressWrap = document.getElementById("progressWrap");
    const progress = document.getElementById("progress");

    function setBusy(busy) {
      state.converting = busy;
      playButton.disabled = busy;
      clearButton.disabled = busy;
      bpmInput.disabled = busy;

      document.querySelectorAll(".file-input").forEach((input) => {
        input.disabled = busy;
      });

      document.querySelectorAll(".file-button").forEach((button) => {
        button.classList.toggle("disabled", busy);
      });

      progressWrap.classList.toggle("visible", busy);
      if (!busy) progress.style.width = "0%";
    }

    function buildInterface() {
      state.tracks.forEach((track, trackIndex) => {
        const section = document.createElement("section");
        section.className = "track";

        const head = document.createElement("div");
        head.className = "track-head";

        const title = document.createElement("div");
        title.className = "track-title";
        title.textContent = track.name;

        const fileName = document.createElement("div");
        fileName.className = "file-name";
        fileName.id = `file-name-${trackIndex}`;
        fileName.textContent = track.fileName;

        head.append(title, fileName);

        const controls = document.createElement("div");
        controls.className = "controls";

        const fileLabel = document.createElement("label");
        fileLabel.className = "file-label";

        const fileButton = document.createElement("span");
        fileButton.className = "file-button";
        fileButton.textContent = "音／動画を選ぶ";

        const fileInput = document.createElement("input");
        fileInput.className = "file-input";
        fileInput.type = "file";
        fileInput.accept = "audio/*,video/*";
        fileInput.addEventListener("change", async (event) => {
          const file = event.target.files?.[0];
          event.target.value = "";
          if (file) await loadFile(file, trackIndex);
        });

        fileLabel.append(fileButton, fileInput);

        const volumeLabel = document.createElement("label");
        volumeLabel.className = "volume-row";
        volumeLabel.textContent = "VOL";

        const volume = document.createElement("input");
        volume.type = "range";
        volume.min = "0";
        volume.max = "1";
        volume.step = "0.01";
        volume.value = String(track.volume);
        volume.addEventListener("input", () => {
          track.volume = Number(volume.value);
          if (track.gainNode && audioContext) {
            track.gainNode.gain.setValueAtTime(
              track.volume,
              audioContext.currentTime
            );
          }
        });

        volumeLabel.append(volume);
        controls.append(fileLabel, volumeLabel);

        const steps = document.createElement("div");
        steps.className = "steps";

        for (let stepIndex = 0; stepIndex < STEP_COUNT; stepIndex += 1) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "step";
          button.dataset.track = String(trackIndex);
          button.dataset.step = String(stepIndex);
          button.textContent = String(stepIndex + 1);
          button.setAttribute("aria-pressed", "false");

          button.addEventListener("click", () => {
            track.steps[stepIndex] = !track.steps[stepIndex];
            button.classList.toggle("active", track.steps[stepIndex]);
            button.setAttribute(
              "aria-pressed",
              String(track.steps[stepIndex])
            );
          });

          steps.appendChild(button);
        }

        section.append(head, controls, steps);
        tracksElement.appendChild(section);
      });
    }

    async function ensureAudioContext() {
      if (!audioContext) {
        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) {
          throw new Error(
            "このブラウザはWeb Audio APIに対応していません。"
          );
        }

        audioContext = new AudioContextClass({
          latencyHint: "interactive"
        });

        state.tracks.forEach((track) => {
          track.gainNode = audioContext.createGain();
          track.gainNode.gain.value = track.volume;
          track.gainNode.connect(audioContext.destination);
        });
      }

      if (audioContext.state === "suspended") {
        await audioContext.resume();
      }
    }

    async function ensureFFmpeg() {
      if (ffmpegLoaded) return;

      if (!window.FFmpegWASM || !window.FFmpegUtil) {
        throw new Error(
          "動画変換ライブラリを読み込めません。通信状態を確認してください。"
        );
      }

      status.textContent =
        "動画変換エンジンを読み込んでいます。初回はしばらくかかります…";
      progress.style.width = "5%";

      const { FFmpeg } = window.FFmpegWASM;
      const { toBlobURL } = window.FFmpegUtil;

      ffmpeg = new FFmpeg();

      ffmpeg.on("progress", ({ progress: ratio }) => {
        if (Number.isFinite(ratio)) {
          const percent = Math.max(10, Math.min(98, ratio * 100));
          progress.style.width = `${percent}%`;
          status.textContent =
            `動画から音声へ変換中… ${Math.round(percent)}%`;
        }
      });

      ffmpeg.on("log", ({ message }) => {
        console.log("[ffmpeg]", message);
      });

      const baseURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd";

      await ffmpeg.load({
        coreURL: await toBlobURL(
          `${baseURL}/ffmpeg-core.js`,
          "text/javascript"
        ),
        wasmURL: await toBlobURL(
          `${baseURL}/ffmpeg-core.wasm`,
          "application/wasm"
        )
      });

      ffmpegLoaded = true;
      progress.style.width = "10%";
    }

    function safeExtension(fileName) {
      const match = fileName.toLowerCase().match(/\.([a-z0-9]+)$/);
      return match ? match[1] : "media";
    }

    async function decodeDirectly(file) {
      const data = await file.arrayBuffer();
      return audioContext.decodeAudioData(data.slice(0));
    }

    async function convertVideoToAudioBuffer(file, trackIndex) {
      const { fetchFile } = window.FFmpegUtil;
      const stamp = `${Date.now()}_${trackIndex}`;
      const inputName = `input_${stamp}.${safeExtension(file.name)}`;
      const outputName = `output_${stamp}.wav`;

      await ensureFFmpeg();

      status.textContent = "動画を読み込んでいます…";
      progress.style.width = "12%";

      try {
        await ffmpeg.writeFile(inputName, await fetchFile(file));

        const exitCode = await ffmpeg.exec([
          "-i", inputName,
          "-map", "0:a:0",
          "-vn",
          "-ac", "1",
          "-ar", "44100",
          "-c:a", "pcm_s16le",
          outputName
        ]);

        if (exitCode !== 0) {
          throw new Error("動画内の音声を取り出せませんでした。");
        }

        progress.style.width = "99%";
        status.textContent = "変換した音声を準備しています…";

        const wavData = await ffmpeg.readFile(outputName);
        const wavBuffer = wavData.buffer.slice(
          wavData.byteOffset,
          wavData.byteOffset + wavData.byteLength
        );

        return await audioContext.decodeAudioData(wavBuffer);
      } finally {
        try { await ffmpeg.deleteFile(inputName); } catch (_) {}
        try { await ffmpeg.deleteFile(outputName); } catch (_) {}
      }
    }

    async function loadFile(file, trackIndex) {
      if (state.converting) return;

      if (file.size > MAX_FILE_SIZE) {
        status.textContent =
          "ファイルが大きすぎます。150MB以下の動画を試してください。";
        return;
      }

      stop();
      setBusy(true);

      const track = state.tracks[trackIndex];
      const oldBuffer = track.buffer;
      const isVideo =
        file.type.startsWith("video/") ||
        /\.(mp4|mov|m4v|webm|avi|mkv)$/i.test(file.name);

      try {
        await ensureAudioContext();

        let decodedBuffer;

        if (isVideo) {
          status.textContent =
            `${file.name} から音声を取り出します…`;
          decodedBuffer = await convertVideoToAudioBuffer(file, trackIndex);
        } else {
          status.textContent = `${file.name} を読み込んでいます…`;

          try {
            decodedBuffer = await decodeDirectly(file);
          } catch (_) {
            status.textContent =
              "音声を変換して読み込んでいます…";
            decodedBuffer =
              await convertVideoToAudioBuffer(file, trackIndex);
          }
        }

        track.buffer = decodedBuffer;
        track.fileName = file.name;
        document.getElementById(
          `file-name-${trackIndex}`
        ).textContent = file.name;

        progress.style.width = "100%";
        status.textContent =
          `${track.name} に ${file.name} を読み込みました。`;
      } catch (error) {
        console.error(error);
        track.buffer = oldBuffer;
        status.textContent =
          error?.message ||
          `${file.name} を読み込めませんでした。`;
      } finally {
        window.setTimeout(() => setBusy(false), 300);
      }
    }

    function triggerTrack(trackIndex, time) {
      const track = state.tracks[trackIndex];
      if (!track.buffer || !audioContext || !track.gainNode) return;

      const source = audioContext.createBufferSource();
      source.buffer = track.buffer;
      source.connect(track.gainNode);
      source.start(time);
    }

    function secondsPerStep() {
      return (60 / state.bpm) / 4;
    }

    function scheduleStep(stepIndex, time, generation) {
      state.tracks.forEach((track, trackIndex) => {
        if (track.steps[stepIndex]) {
          triggerTrack(trackIndex, time);
        }
      });

      const delay = Math.max(
        0,
        (time - audioContext.currentTime) * 1000
      );

      window.setTimeout(() => {
        if (
          state.playing &&
          state.generation === generation
        ) {
          updatePlayhead(stepIndex);
        }
      }, delay);
    }

    function advanceStep() {
      state.nextTime += secondsPerStep();
      state.currentStep =
        (state.currentStep + 1) % STEP_COUNT;
    }

    function scheduler() {
      if (!audioContext) return;

      while (
        state.playing &&
        state.nextTime <
          audioContext.currentTime + state.scheduleAhead
      ) {
        scheduleStep(
          state.currentStep,
          state.nextTime,
          state.generation
        );
        advanceStep();
      }
    }

    function updatePlayhead(stepIndex) {
      document
        .querySelectorAll(".step.playhead")
        .forEach((element) => {
          element.classList.remove("playhead");
        });

      document
        .querySelectorAll(`.step[data-step="${stepIndex}"]`)
        .forEach((element) => {
          element.classList.add("playhead");
        });
    }

    async function start() {
      if (state.playing || state.converting) return;

      try {
        await ensureAudioContext();

        state.playing = true;
        state.generation += 1;
        state.currentStep = 0;
        state.nextTime =
          audioContext.currentTime + 0.06;
        state.timerId = window.setInterval(
          scheduler,
          state.lookaheadMs
        );
        scheduler();

        playButton.textContent = "PLAYING";
        status.textContent = "再生中";
      } catch (error) {
        console.error(error);
        status.textContent = error.message;
      }
    }

    function stop() {
      state.playing = false;
      state.generation += 1;

      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }

      playButton.textContent = "▶ PLAY";

      document
        .querySelectorAll(".step.playhead")
        .forEach((element) => {
          element.classList.remove("playhead");
        });
    }

    function clearPattern() {
      if (state.converting) return;

      state.tracks.forEach((track) => {
        track.steps.fill(false);
      });

      document
        .querySelectorAll(".step.active")
        .forEach((element) => {
          element.classList.remove("active");
          element.setAttribute("aria-pressed", "false");
        });

      status.textContent = "パターンを消去しました。";
    }

    function updateBpm() {
      const value = Number(bpmInput.value);
      state.bpm = Math.min(
        300,
        Math.max(30, value || 120)
      );
      bpmInput.value = String(state.bpm);
      status.textContent = `BPM ${state.bpm}`;
    }

    playButton.addEventListener("click", start);
    stopButton.addEventListener("click", () => {
      stop();
      status.textContent = "停止しました。";
    });
    clearButton.addEventListener("click", clearPattern);
    bpmInput.addEventListener("change", updateBpm);
    bpmInput.addEventListener("blur", updateBpm);

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && state.playing) {
        stop();
      }
    });

    buildInterface();
  </script>
</body>
</html>
