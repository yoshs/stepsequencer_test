<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <title>8-Step Sampler</title>
  <style>
    :root {
      --bg: #111318;
      --panel: #1b1f27;
      --panel-2: #252b36;
      --text: #f4f4f5;
      --muted: #9ca3af;
      --active: #f59e0b;
      --play: #22c55e;
      --stop: #ef4444;
      --playhead: #38bdf8;
      --border: #3b4351;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--bg);
      touch-action: manipulation;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(14px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(22px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #0b0d11, var(--bg));
    }

    button, input {
      font: inherit;
    }

    button {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .app {
      width: min(100%, 900px);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 5px;
      font-size: clamp(26px, 7vw, 42px);
    }

    .subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .transport {
      position: sticky;
      top: max(8px, env(safe-area-inset-top));
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      padding: 10px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: rgba(27, 31, 39, .96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .transport button {
      min-height: 48px;
      border: 0;
      border-radius: 11px;
      font-weight: 800;
    }

    #playButton {
      background: var(--play);
      color: #061008;
    }

    #stopButton {
      background: var(--stop);
      color: white;
    }

    #clearButton {
      background: var(--panel-2);
      color: white;
      border: 1px solid var(--border);
    }

    .bpm-row {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px 0;
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
    }

    #bpmInput {
      width: 100px;
      min-height: 42px;
      padding: 8px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #0e1117;
      color: white;
      text-align: center;
    }

    .track {
      margin-bottom: 13px;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }

    .track-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 9px;
    }

    .track-title {
      font-weight: 800;
      font-size: 17px;
    }

    .file-name {
      max-width: 52vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 10px;
    }

    .file-label input {
      display: none;
    }

    .file-button {
      min-height: 44px;
      display: grid;
      place-items: center;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      font-weight: 700;
      font-size: 14px;
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      min-height: 38px;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .step {
      min-height: 58px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--muted);
      font-weight: 900;
      font-size: 16px;
    }

    .step.active {
      background: var(--active);
      border-color: #fbbf24;
      color: #211400;
    }

    .step.playhead {
      outline: 3px solid var(--playhead);
      outline-offset: 2px;
    }

    .status {
      min-height: 1.5em;
      margin: 8px 2px 0;
      color: var(--playhead);
      font-size: 13px;
      line-height: 1.4;
    }

    .note {
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    @media (min-width: 700px) {
      .steps {
        grid-template-columns: repeat(8, 1fr);
      }

      .step {
        min-height: 64px;
      }

      .file-name {
        max-width: 420px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>8-Step Sampler</h1>
    <p class="subtitle">音声ファイルや動画ファイルの音を使える、4トラックのシンプルなステップシーケンサー</p>

    <section class="transport">
      <button id="playButton" type="button">▶ PLAY</button>
      <button id="stopButton" type="button">■ STOP</button>
      <button id="clearButton" type="button">CLEAR</button>

      <label class="bpm-row">
        <span>BPM</span>
        <input id="bpmInput" type="number" inputmode="numeric" min="30" max="300" value="120" />
      </label>
    </section>

    <section id="tracks"></section>

    <p id="status" class="status" aria-live="polite"></p>
    <p class="note">
      「音／動画を選ぶ」からWAV、MP3、M4A、MP4、MOVなどを選べます。
      動画は画面には表示せず、対応している場合は音声トラックだけを再生します。
    </p>
  </main>

  <script>
    "use strict";

    const TRACK_COUNT = 4;
    const STEP_COUNT = 8;

    const state = {
      bpm: 120,
      playing: false,
      currentStep: 0,
      nextTime: 0,
      timerId: null,
      generation: 0,
      lookaheadMs: 25,
      scheduleAhead: 0.1,
      tracks: Array.from({ length: TRACK_COUNT }, (_, index) => ({
        name: `Track ${index + 1}`,
        fileName: "未選択",
        buffer: null,
        mediaUrl: null,
        mediaTemplate: null,
        volume: 0.8,
        gainNode: null,
        steps: Array(STEP_COUNT).fill(false)
      }))
    };

    let audioContext = null;

    const tracksElement = document.getElementById("tracks");
    const playButton = document.getElementById("playButton");
    const stopButton = document.getElementById("stopButton");
    const clearButton = document.getElementById("clearButton");
    const bpmInput = document.getElementById("bpmInput");
    const status = document.getElementById("status");

    function buildInterface() {
      state.tracks.forEach((track, trackIndex) => {
        const section = document.createElement("section");
        section.className = "track";

        const head = document.createElement("div");
        head.className = "track-head";

        const title = document.createElement("div");
        title.className = "track-title";
        title.textContent = track.name;

        const fileName = document.createElement("div");
        fileName.className = "file-name";
        fileName.id = `file-name-${trackIndex}`;
        fileName.textContent = track.fileName;

        head.append(title, fileName);

        const controls = document.createElement("div");
        controls.className = "controls";

        const fileLabel = document.createElement("label");
        fileLabel.className = "file-label";

        const fileButton = document.createElement("span");
        fileButton.className = "file-button";
        fileButton.textContent = "音／動画を選ぶ";

        const fileInput = document.createElement("input");
        fileInput.type = "file";
        fileInput.accept = "audio/*,video/*";
        fileInput.addEventListener("change", async (event) => {
          const file = event.target.files?.[0];
          if (file) await loadFile(file, trackIndex);
          event.target.value = "";
        });

        fileLabel.append(fileButton, fileInput);

        const volumeLabel = document.createElement("label");
        volumeLabel.className = "volume-row";
        volumeLabel.textContent = "VOL";

        const volume = document.createElement("input");
        volume.type = "range";
        volume.min = "0";
        volume.max = "1";
        volume.step = "0.01";
        volume.value = String(track.volume);
        volume.addEventListener("input", () => {
          track.volume = Number(volume.value);
          if (track.gainNode && audioContext) {
            track.gainNode.gain.setValueAtTime(track.volume, audioContext.currentTime);
          }
        });

        volumeLabel.append(volume);
        controls.append(fileLabel, volumeLabel);

        const steps = document.createElement("div");
        steps.className = "steps";

        for (let stepIndex = 0; stepIndex < STEP_COUNT; stepIndex += 1) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "step";
          button.dataset.track = String(trackIndex);
          button.dataset.step = String(stepIndex);
          button.textContent = String(stepIndex + 1);
          button.setAttribute("aria-pressed", "false");

          button.addEventListener("click", () => {
            track.steps[stepIndex] = !track.steps[stepIndex];
            button.classList.toggle("active", track.steps[stepIndex]);
            button.setAttribute("aria-pressed", String(track.steps[stepIndex]));
          });

          steps.appendChild(button);
        }

        section.append(head, controls, steps);
        tracksElement.appendChild(section);
      });
    }

    async function ensureAudioContext() {
      if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          throw new Error("このブラウザはWeb Audio APIに対応していません。");
        }

        audioContext = new AudioContextClass({ latencyHint: "interactive" });

        state.tracks.forEach((track) => {
          track.gainNode = audioContext.createGain();
          track.gainNode.gain.value = track.volume;
          track.gainNode.connect(audioContext.destination);
        });
      }

      if (audioContext.state === "suspended") {
        await audioContext.resume();
      }
    }

    function clearOldMedia(track) {
      if (track.mediaUrl) {
        URL.revokeObjectURL(track.mediaUrl);
      }
      track.buffer = null;
      track.mediaUrl = null;
      track.mediaTemplate = null;
    }

    async function loadFile(file, trackIndex) {
      const track = state.tracks[trackIndex];
      clearOldMedia(track);

      status.textContent = `${file.name} を読み込んでいます…`;

      try {
        await ensureAudioContext();

        const data = await file.arrayBuffer();

        try {
          track.buffer = await audioContext.decodeAudioData(data.slice(0));
          track.fileName = file.name;
          document.getElementById(`file-name-${trackIndex}`).textContent = file.name;
          status.textContent = `${track.name} に ${file.name} を読み込みました。`;
          return;
        } catch (decodeError) {
          console.info("AudioBufferとしての読み込みに失敗。メディア再生に切り替えます。", decodeError);
        }

        const url = URL.createObjectURL(file);
        const media = document.createElement(file.type.startsWith("video/") ? "video" : "audio");
        media.src = url;
        media.preload = "auto";
        media.playsInline = true;

        await new Promise((resolve, reject) => {
          const cleanup = () => {
            media.removeEventListener("loadedmetadata", onReady);
            media.removeEventListener("canplaythrough", onReady);
            media.removeEventListener("error", onError);
          };

          const onReady = () => {
            cleanup();
            resolve();
          };

          const onError = () => {
            cleanup();
            reject(new Error("このファイル形式をブラウザで再生できません。"));
          };

          media.addEventListener("loadedmetadata", onReady, { once: true });
          media.addEventListener("canplaythrough", onReady, { once: true });
          media.addEventListener("error", onError, { once: true });
          media.load();
        });

        track.mediaUrl = url;
        track.mediaTemplate = media;
        track.fileName = file.name;
        document.getElementById(`file-name-${trackIndex}`).textContent = file.name;
        status.textContent = `${track.name} に ${file.name} を読み込みました。動画の場合は音だけ再生します。`;

      } catch (error) {
        console.error(error);
        clearOldMedia(track);
        status.textContent = `${file.name} を読み込めませんでした。別の形式を試してください。`;
      }
    }

    function triggerTrack(trackIndex, time) {
      const track = state.tracks[trackIndex];

      if (track.buffer && audioContext) {
        const source = audioContext.createBufferSource();
        source.buffer = track.buffer;
        source.connect(track.gainNode);
        source.start(time);
        return;
      }

      if (track.mediaTemplate) {
        const delay = Math.max(0, (time - audioContext.currentTime) * 1000);

        window.setTimeout(() => {
          const player = track.mediaTemplate.cloneNode(true);
          player.volume = track.volume;
          player.currentTime = 0;
          player.playsInline = true;
          player.play().catch((error) => {
            console.error(error);
            status.textContent = "動画・音声の再生がブラウザに止められました。もう一度PLAYを押してください。";
          });

          const remove = () => {
            player.pause();
            player.removeAttribute("src");
            player.load();
          };

          player.addEventListener("ended", remove, { once: true });
          window.setTimeout(remove, 30000);
        }, delay);
      }
    }

    function secondsPerStep() {
      return (60 / state.bpm) / 4;
    }

    function scheduleStep(stepIndex, time, generation) {
      state.tracks.forEach((track, trackIndex) => {
        if (track.steps[stepIndex]) {
          triggerTrack(trackIndex, time);
        }
      });

      const delay = Math.max(0, (time - audioContext.currentTime) * 1000);

      window.setTimeout(() => {
        if (state.playing && state.generation === generation) {
          updatePlayhead(stepIndex);
        }
      }, delay);
    }

    function advanceStep() {
      state.nextTime += secondsPerStep();
      state.currentStep = (state.currentStep + 1) % STEP_COUNT;
    }

    function scheduler() {
      while (
        state.playing &&
        state.nextTime < audioContext.currentTime + state.scheduleAhead
      ) {
        scheduleStep(state.currentStep, state.nextTime, state.generation);
        advanceStep();
      }
    }

    function updatePlayhead(stepIndex) {
      document.querySelectorAll(".step.playhead").forEach((element) => {
        element.classList.remove("playhead");
      });

      document.querySelectorAll(`.step[data-step="${stepIndex}"]`).forEach((element) => {
        element.classList.add("playhead");
      });
    }

    async function start() {
      if (state.playing) return;

      try {
        await ensureAudioContext();

        state.playing = true;
        state.generation += 1;
        state.currentStep = 0;
        state.nextTime = audioContext.currentTime + 0.06;
        state.timerId = window.setInterval(scheduler, state.lookaheadMs);
        scheduler();

        playButton.textContent = "PLAYING";
        status.textContent = "再生中";
      } catch (error) {
        console.error(error);
        status.textContent = error.message;
      }
    }

    function stop() {
      state.playing = false;
      state.generation += 1;

      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }

      playButton.textContent = "▶ PLAY";
      document.querySelectorAll(".step.playhead").forEach((element) => {
        element.classList.remove("playhead");
      });
      status.textContent = "停止しました。";
    }

    function clearPattern() {
      state.tracks.forEach((track) => track.steps.fill(false));

      document.querySelectorAll(".step.active").forEach((element) => {
        element.classList.remove("active");
        element.setAttribute("aria-pressed", "false");
      });

      status.textContent = "パターンを消去しました。";
    }

    function updateBpm() {
      const value = Number(bpmInput.value);
      state.bpm = Math.min(300, Math.max(30, value || 120));
      bpmInput.value = String(state.bpm);
      status.textContent = `BPM ${state.bpm}`;
    }

    playButton.addEventListener("click", start);
    stopButton.addEventListener("click", stop);
    clearButton.addEventListener("click", clearPattern);
    bpmInput.addEventListener("change", updateBpm);
    bpmInput.addEventListener("blur", updateBpm);

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && state.playing) stop();
    });

    buildInterface();
  </script>
</body>
</html>
